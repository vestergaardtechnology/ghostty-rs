[package]
name = "ghostty"
version = "1.3.0-dev"
edition = "2021"
description = "Rust port of the Ghostty terminal emulator"
license = "MIT"
autobins = false

# Each checkout (including agent worktrees nested under .claude/) is its own workspace root.
[workspace]

[lib]
name = "ghostty"
path = "src/root.rs"

[[bin]]
name = "ghostty"
path = "src/main.rs"

[features]
default = []
inspector = []
# Crash reporting via the Sentry native SDK (links the system `sentry` C library).
sentry = []
gtk = ["dep:gio", "dep:glib"]

[dependencies]
getrandom = "0.3"
gio = { version = "0.21", optional = true }
glib = { version = "0.21", optional = true }
half = "2"
indexmap = "2"
libc = "0.2"
log = "0.4"
memchr = "2"
png = "0.18"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
