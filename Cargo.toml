[package]
name = "ghostty"
version = "1.3.0-dev"
edition = "2021"
description = "Rust port of the Ghostty terminal emulator"
license = "MIT"
autobins = false

[lib]
name = "ghostty"
path = "src/root.rs"

[[bin]]
name = "ghostty"
path = "src/main.rs"

[features]
default = []

[dependencies]
half = "2"
log = "0.4"

[dev-dependencies]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
