[package]
name = "ghostty"
version = "1.3.0-dev"
edition = "2021"
description = "Rust port of the Ghostty terminal emulator"
license = "MIT"
autobins = false

# Each checkout (including agent worktrees nested under .claude/) is its own workspace root.
[workspace]

[lib]
name = "ghostty"
path = "src/root.rs"

[[bin]]
name = "ghostty"
path = "src/main.rs"

[features]
default = []
inspector = []

[dependencies]
getrandom = "0.3"
half = "2"
indexmap = "2"
libc = "0.2"
log = "0.4"
memchr = "2"
png = "0.18"

[dev-dependencies]

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
