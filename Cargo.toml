[package]
name = "ghostty"
version = "1.3.0-dev"
edition = "2021"
description = "Rust port of the Ghostty terminal emulator"
license = "MIT"
autobins = false

# Each checkout (including agent worktrees nested under .claude/) is its own workspace root.
[workspace]

[lib]
name = "ghostty"
path = "src/root.rs"

[[bin]]
name = "ghostty"
path = "src/main.rs"

[features]
default = []

[dependencies]
log = "0.4"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
png = "0.18"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
