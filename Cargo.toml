[package]
name = "ghostty"
version = "1.3.0-dev"
edition = "2021"
description = "Rust port of the Ghostty terminal emulator"
license = "MIT"
autobins = false

[lib]
name = "ghostty"
path = "src/root.rs"

[[bin]]
name = "ghostty"
path = "src/main.rs"

[features]
default = []
# Crash reporting via the Sentry native SDK (links the system `sentry` C library).
sentry = []

[dependencies]
getrandom = "0.3"
libc = "0.2"
log = "0.4"
memchr = "2"
png = "0.18"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
