# Port of `test/esctest/build.zig`: runs esctest against libghostty-vt.
# `run.sh` fetches esctest (pinned below) and runs the runner.
[package]
name = "esctest-libghostty"
version = "0.0.0"
edition = "2021"
publish = false

# Not part of the main workspace.
[workspace]

[dependencies]
ghostty = { path = "../..", default-features = false }
libc = "0.2"
log = "0.4"

[[bin]]
name = "esctest-libghostty"
path = "src/main.rs"
